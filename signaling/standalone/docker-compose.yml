services:
  signaling:
    build: .
    container_name: saito-signal
    restart: unless-stopped
    ports:
      - "8787:8787"
    environment:
      PORT: "8787"
      HOST: "0.0.0.0"
      STUN_URLS: "${STUN_URLS:-stun:stun.miwifi.com:3478}"
      TURN_URLS: "turn:${PUBLIC_IP}:3478?transport=udp"
      TURN_SECRET: "${TURN_SECRET}"
      TURN_LIMIT_PER_MINUTE: "${TURN_LIMIT_PER_MINUTE:-10}"

  coturn:
    image: coturn/coturn:alpine
    container_name: saito-coturn
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./turnserver.conf:/etc/coturn/turnserver.conf:ro
    command: ["-c", "/etc/coturn/turnserver.conf"]
