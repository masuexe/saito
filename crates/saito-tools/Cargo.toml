[package]
name = "saito-tools"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "The developer's and verification's command line over saito-frontend, with no window: headless frames, the audits, the replay of the original's recordings, match setups and replays checked"

[[bin]]
name = "saito-tool"
path = "src/main.rs"

[dependencies]
saito-frontend = { path = "../saito-frontend" }
saito-battle = { path = "../saito-battle" }
saito-render = { path = "../saito-render" }
# A replay as video: an MP4, ffmpeg run to encode it (`--mp4`).
saito-video = { path = "../saito-video" }
# The recording replay (src/trace.rs): a recording is the original's
# numbers, which a game's compat crate reads and compares.
exe6-compat = { path = "../exe6-compat", features = ["trace"] }
exe5-compat = { path = "../exe5-compat", features = ["trace"] }
exe4-compat = { path = "../exe4-compat", features = ["trace"] }
saito-assets = { path = "../saito-assets" }
# The sound's lookups and the audit's mixing (no audio device).
saito-audio = { path = "../saito-audio", default-features = false }
saito-content = { path = "../saito-content" }
saito-match = { path = "../saito-match" }
saito-content-api = { path = "../saito-content-api" }
m4a.workspace = true
# A recording's setup line, for the game it states.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
# Reading the headless test's PNGs back.
png = "0.17"
saito-battle = { path = "../saito-battle", features = ["test-content"] }
saito-match = { path = "../saito-match", features = ["testing"] }
