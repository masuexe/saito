[package]
name = "saito-updater"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "The app's own updates from saito's GitHub releases: Velopack's on the desktop, the release's APK through Android's installer, none in a browser or on iOS"

[dependencies]
# What goes wrong, said as a warning: the app keeps them in its log.
log = "0.4"

# The desktop's: Velopack's packages (packaging/), from the project's GitHub releases. The version the release
# workflow's `vpk` is (VPK_VERSION), exactly: the first release on crates.io that asks for zip 9 (the ones before asked
# for zip 8, all of whose versions are yanked).
[target.'cfg(not(any(target_arch = "wasm32", target_os = "ios", target_os = "android")))'.dependencies]
velopack = { version = "=1.3.39-g8d2844f", features = ["public-utils"] }

# Desktop & Android HTTP(S) client: newest release JSON, Velopack feeds/packages, and APK over reqwest (rustls with
# ring's provider), each on a tokio runtime of its own thread.
[target.'cfg(not(any(target_arch = "wasm32", target_os = "ios")))'.dependencies]
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "stream"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio = { version = "1", features = ["rt", "time"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Android's APK verification and PackageInstaller JNI bridge.
[target.'cfg(target_os = "android")'.dependencies]
sha2 = "0.10"
saito-files = { path = "../saito-files" }
jni = "0.22"
ndk-context = "0.1"

[dev-dependencies]
# Velopack's feeds, written for its check in the desktop's tests.
serde_json = "1"
# Velopack's installed app and its feeds, in folders of the tests' own.
tempfile = "3"

[build-dependencies]
# The targets by name (build.rs).
cfg_aliases = "0.2"
