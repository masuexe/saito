[package]
name = "saito-sim-host"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Cross-platform Wasmtime/Pulley host runtime and local kernel store for sandboxed historical replay playback"

[dependencies]
saito-sim-abi = { path = "../saito-sim-abi" }
saito-battle = { path = "../saito-battle" }
saito-extract = { path = "../saito-extract" }
saito-files = { path = "../saito-files" }
saito-frontend = { path = "../saito-frontend" }
saito-render = { path = "../saito-render" }
saito-replay = { path = "../saito-replay" }
flate2 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.8"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
wasmtime = { version = "51", default-features = false, features = ["runtime", "cranelift", "std", "gc", "gc-drc", "pulley"] }
wasmtime-wasi = { version = "51", default-features = false, features = ["p1"] }

[dev-dependencies]
saito-frontend = { path = "../saito-frontend", features = ["testing"] }
saito-match = { path = "../saito-match", features = ["testing"] }
saito-content = { path = "../saito-content" }
tempfile = "3"
