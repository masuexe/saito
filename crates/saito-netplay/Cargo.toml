[package]
name = "saito-netplay"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Rollback netplay for the battle engine on getgud, with a simulated network for testing"

[dependencies]
saito-battle.workspace = true
# The handles a tick's payload and a player's setup name content by.
saito-content-api = { path = "../saito-content-api" }
getgud.workspace = true
rennet.workspace = true

[dev-dependencies]
saito-battle = { workspace = true, features = ["test-content"] }
