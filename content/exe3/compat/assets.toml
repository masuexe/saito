# EXE3's asset names, verified against the Legacy Collection Vol. 1 ROMs (A6BE/A3XE/A6BJ/A3XJ).
# Sprites: "cc-ii" (category byte offset in SpritePointersList 0x0802477C and slot index).
# Battle sprites live in categories 0x04..=0x1C (Battle MegaMan is 04-00); portraits in 0x20.

[sprites]
megaman = "04-00"
megaman-guts = "04-01"
megaman-custom = "04-02"
megaman-team = "04-03"
megaman-shield = "04-04"
megaman-ground = "04-05"
megaman-shadow = "04-06"
megaman-bug = "04-07"
portrait-megaman = "20-00"
portrait-lan = "20-01"

# Battle & menu sounds (M4A gSongTable at A6BE 0x08148B6C, 331 entries).
[sounds]
battle-net = 0x1e       # Virus Busting / NetBattle (0x08006AFA)
battle-win = 0x1f       # Victory fanfare (0x08015946)
battle-boss = 0x20      # Boss / Match-point NetBattle (0x08006ADA, 0x080096B8)
netbattle-1 = 0x19      # NetBattle round BGM table (0x080076C9)
netbattle-2 = 0x1a
netbattle-3 = 0x1c
netbattle-4 = 0x05
sfx-cursor = 0x67
sfx-confirm = 0x68
sfx-cancel = 0x69
sfx-error = 0x6a
sfx-custom-open = 0x6c
sfx-recover = 0x72
sfx-chip-select = 0xc7

