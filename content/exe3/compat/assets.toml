# EXE3's asset names, verified against the Legacy Collection Vol. 1 ROMs (A6BE/A3XE/A6BJ/A3XJ).
# Sprites: "cc-ii" (category byte offset in SpritePointersList 0x0802477C and slot index).
# Battle MegaMan (Normal + all Style palette swaps) lives at 00-00 (0x08237820, 63 anims, 58 palettes);
# viruses/bosses/attacks/effects live in 04..1C; dialogue portraits live in 20.

[sprites]
megaman = "00-00"
sword = "0c-00"
cannon = "0c-01"
bomb = "0c-02"
bubble = "0c-04"
muzzle-flash = "0c-06"
aura = "0c-07"
heal = "0c-12"
grab-shot = "0c-13"
sword-slash = "0c-14"
big-slash = "0c-15"
air-shooter = "0c-18"
spreader = "0c-19"
reflector-shield = "0c-1b"
barrier = "0c-37"
ice = "08-02"
explosion = "14-00"
impact = "14-01"
small-puff = "14-02"
deletion = "14-03"
pink-flash = "14-04"
hit-sparks = "14-05"
hit = "14-06"
hit-marker = "14-07"
charge-glow = "14-08"
blindness = "14-09"
burst = "14-0a"
confusion = "14-0b"
chip-destruction-spark = "14-0c"
puff = "14-0d"
dust = "14-0e"
immobilized = "14-0f"
