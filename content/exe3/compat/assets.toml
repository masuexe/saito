[backgrounds]
acdc-net = 0
acdc-net-dark = 1
lan-hp = 2
school-comp = 3
sci-lab-net = 4
yoka-net = 5
beach-net = 6
zoo-comp = 7
inn-comp = 8
yoka-net-alt = 9
hospital-comp = 10
n1-grand-prix = 11
n1-grand-prix-alt = 12
hadess-isle = 13
hadess-isle-alt = 14
www-comp = 15
undernet = 16
undernet-1 = 17
undernet-2 = 18
undernet-3 = 19
undernet-4 = 20
alpha-core = 21
alpha-final = 22
secret-area = 23
generic-comp = 24
serenade-area = 25
yoka-net-2 = 26
yoka-net-3 = 27
yoka-net-4 = 28
alpha-core-fast = 29

