# EXE3's 11 panel types by number, extracted from A6BE IWRAM copy table at 0x08236F84 (IWRAM 0x03006E84).
# EXE3 has 11 panel types (0..=10); panel type 10 is Sand (unlike EXE4's pitfall/hole 10/11).
# Panel blocks live at 0x087005A0 (66 blocks of 32 bytes: 6 * type + 3 * owner + row - 1),
# with per-block base tile offsets at 0x0800AF60.

[types.0]
name = "missing"
flags = 0x18000

[types.1]
name = "broken"
flags = 0x14000

